name: Setup asdf tools
description: Install terraform, terragrunt, and terramate from .tool-versions via asdf
runs:
  using: composite
  steps:
    - name: Install Terramate
      uses: terramate-io/terramate-action@1cc78a548efefaab7762f4d06f51aa6de06ce201 # v3.3.0
    - uses: asdf-vm/actions/setup@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1

    - name: Add asdf plugins
      shell: bash
      run: |
        asdf plugin add terraform
        asdf plugin add terragrunt

    - name: Install tools from .tool-versions
      shell: bash
      run: asdf install

    - name: Verify installed versions
      shell: bash
      run: |
        echo "Pinned in .tool-versions:"
        cat .tool-versions
        echo ""
        asdf current
        terraform version
        terragrunt --version
        terramate version
