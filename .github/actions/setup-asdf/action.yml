name: Setup asdf tools
description: Install terraform, terragrunt, and terramate from .tool-versions via asdf
runs:
  using: composite
  steps:
    - uses: asdf-vm/actions/setup@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
      with:
        install: false

    - name: Add asdf plugins
      shell: bash
      run: |
        asdf plugin add terraform https://github.com/asdf-community/asdf-hashicorp.terraform.git \
          || asdf plugin update terraform
        asdf plugin add terragrunt https://github.com/gruntwork-io/asdf-terragrunt.git \
          || asdf plugin update terragrunt
        asdf plugin add terramate https://github.com/terramate-io/asdf-terramate.git \
          || asdf plugin update terramate

    - name: Install tools from .tool-versions
      shell: bash
      run: asdf install

    - name: Verify installed versions
      shell: bash
      run: |
        echo "Pinned in .tool-versions:"
        cat .tool-versions
        echo ""
        asdf current
        terraform version
        terragrunt --version
        terramate version
