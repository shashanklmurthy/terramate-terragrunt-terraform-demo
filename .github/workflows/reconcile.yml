name: reconcile
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea53d8efaa4189211918 # v4.2.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-asdf
      - name: Reconcile tagged stacks (apply, in dependency order)
        run: terramate run --tags reconcile -- terragrunt apply -auto-approve -lock=false -input=false
