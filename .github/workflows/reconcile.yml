name: reconcile
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea53d8efaa4189211918 # v4.2.2
        with:
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@b9cd54cb3e349558e5125b2eab9ebb7ad426cb48 # v3.1.2
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - name: Setup Terragrunt
        run: |
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v0.77.22/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
      - uses: terramate-io/terramate-action@b5d1461d435ba454179045ea062bbecb32738913 # v2
      - name: Reconcile tagged stacks (apply, in dependency order)
        run: terramate run --tags reconcile -- terragrunt apply -auto-approve -lock=false -input=false
