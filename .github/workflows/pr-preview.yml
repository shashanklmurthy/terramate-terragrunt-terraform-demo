name: pr-preview
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    uses: ./.github/workflows/_terraform-fmt.yml
  hclfmt:
    uses: ./.github/workflows/_terragrunt-hclfmt.yml
  checkov:
    uses: ./.github/workflows/_checkov.yml

  preview:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      pull-requests: write
    env:
      TM_CHANGED: >-
        --changed --include-all-dependents
        --git-change-base origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-asdf

      - name: List changed stacks
        id: list
        run: |
          stacks="$(terramate list $TM_CHANGED --run-order)"
          if [ -z "$stacks" ]; then
            echo "has_stacks=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_stacks=true" >> "$GITHUB_OUTPUT"
            {
              echo "stacks<<EOF"
              echo "$stacks"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize Terragrunt in changed stacks
        if: steps.list.outputs.has_stacks == 'true'
        run: |
          terramate run \
            --parallel 1 \
            $TM_CHANGED \
            -- \
            terragrunt init -input=false -lock-timeout=5m

      - name: Validate Terragrunt in changed stacks
        if: steps.list.outputs.has_stacks == 'true'
        run: |
          terramate run \
            $TM_CHANGED \
            -- \
            terragrunt validate

      - name: Plan Terragrunt changes in changed stacks
        if: steps.list.outputs.has_stacks == 'true'
        id: plan
        run: |
          terramate run \
            $TM_CHANGED \
            --continue-on-error \
            -- \
            bash -c 'terragrunt plan -out "$(pwd)/out.tfplan" -lock=false -input=false'

      - name: Write per-stack plans to job summary
        if: always() && steps.list.outputs.has_stacks == 'true'
        run: |
          while IFS= read -r stack; do
            [ -z "$stack" ] && continue
            {
              echo "### Plan — \`${stack}\`"
              echo '```terraform'
              ( cd "$stack" && terragrunt show -no-color "$(pwd)/out.tfplan" ) 2>&1 || echo "(failed to render plan)"
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done <<< "${{ steps.list.outputs.stacks }}"

      - name: Publish per-stack pull request comments
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STACKS: ${{ steps.list.outputs.stacks }}
          PLAN_FAILED: ${{ steps.plan.outcome == 'failure' && 'true' || 'false' }}
        with:
          script: |
            const postStackPlanComments = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/post-stack-plan-comments.cjs`);
            await postStackPlanComments({ github, context, core });

      - name: Fail if plan failed
        if: steps.list.outputs.has_stacks == 'true' && steps.plan.outcome == 'failure'
        run: exit 1
