name: pr-preview
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    uses: ./.github/workflows/_terraform-fmt.yml
  hclfmt:
    uses: ./.github/workflows/_terragrunt-hclfmt.yml
  validate:
    uses: ./.github/workflows/_terragrunt-validate.yml
  checkov:
    uses: ./.github/workflows/_checkov.yml

  preview:
    uses: ./.github/workflows/_plan-or-apply-env.yml
    with:
      mode: plan
      environment: dev
      git-change-base: origin/${{ github.base_ref }}
      seed-baseline: true
      disable-git-safeguard: true
      checkout-ref: ${{ github.head_ref || github.ref }}
    permissions:
      contents: read

  comment-plans:
    needs: preview
    if: always() && needs.preview.outputs.has_stacks == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    strategy:
      matrix:
        stack: ${{ fromJson(needs.preview.outputs.stacks_json) }}
      max-parallel: 1
    steps:
      - name: Download plan artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plan-artifacts
          path: .github/plan-artifacts

      - name: Resolve plan file for stack
        id: plan
        shell: bash
        run: |
          slug="${{ matrix.stack }}"
          slug="${slug//\//-}"
          plan_path=".github/plan-artifacts/${slug}.txt"
          ec_file=".github/plan-artifacts/${slug}.exitcode"
          if [ ! -f "$plan_path" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "plan_path=$plan_path" >> "$GITHUB_OUTPUT"
          echo "exitcode=$(cat "$ec_file" 2>/dev/null || echo 1)" >> "$GITHUB_OUTPUT"

      - name: Post plan comment
        if: steps.plan.outputs.missing != 'true'
        uses: GetTerminus/terraform-pr-commenter@93a60116ff139d4e9b92b2b61ddc15ebfbdb89c6 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TF_WORKSPACE: ${{ matrix.stack }}
          EXPAND_SUMMARY_DETAILS: "true"
          HIGHLIGHT_CHANGES: "true"
        with:
          commenter_type: plan
          commenter_plan_path: ${{ steps.plan.outputs.plan_path }}
          commenter_exitcode: ${{ steps.plan.outputs.exitcode }}
          terraform_version: ${{ needs.preview.outputs.terraform_version }}
