name: _terragrunt-validate
on:
  workflow_call: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3
      - uses: ./.github/actions/setup-asdf
      - name: Initialize Terragrunt in all stacks
        run: terramate run --parallel 10 -- terragrunt init -input=false -lock-timeout=5m
      - name: Validate Terragrunt in all stacks
        run: terramate run -- terragrunt validate
