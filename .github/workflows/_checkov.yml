# Scans the Terraform modules (the live/ dirs are pure Terragrunt HCL).
name: _checkov
on:
  workflow_call:
    inputs:
      directory:
        type: string
        default: "modules"

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea53d8efaa4189211918 # v4.2.2
      - uses: bridgecrewio/checkov-action@dfb51aed1b783289b0d3f255028e7a88d5e8caa1 # v12
        with:
          directory: ${{ inputs.directory }}
          framework: terraform
          soft_fail: true
