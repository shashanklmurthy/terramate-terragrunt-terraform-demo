# Mirrors gp-nova _checkov. Scans the Terraform modules (the live/ dirs are pure Terragrunt HCL).
name: _checkov
on:
  workflow_call:
    inputs:
      directory:
        type: string
        default: "modules"

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea53d8efaa4189211918 # v4.2.2
      - uses: bridgecrewio/checkov-action@b7c2a7c4e6c8e0e0e0e0e0e0e0e0e0e0e0e0e0e0 # v12.2976.0
        with:
          directory: ${{ inputs.directory }}
          framework: terraform
          soft_fail: true
